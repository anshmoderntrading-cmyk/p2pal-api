name: Build P2Pal APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-apk.yml']

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      # Keys: repo Settings -> Secrets and variables -> Actions me daalo (optional; na ho to public RPC chalega)
      EXPO_PUBLIC_API_BASE_URL: https://p2pal-api.onrender.com
      EXPO_PUBLIC_BSC_RPC: ${{ secrets.EXPO_PUBLIC_BSC_RPC }}
      EXPO_PUBLIC_TRONGRID_API_KEY: ${{ secrets.EXPO_PUBLIC_TRONGRID_API_KEY }}
      EXPO_PUBLIC_ETHERSCAN_API_KEY: ${{ secrets.EXPO_PUBLIC_ETHERSCAN_API_KEY }}
      EXPO_PUBLIC_ONRAMP_APP_ID: ${{ secrets.EXPO_PUBLIC_ONRAMP_APP_ID }}
      EXPO_PUBLIC_TRANSAK_API_KEY: ${{ secrets.EXPO_PUBLIC_TRANSAK_API_KEY }}
      EXPO_PUBLIC_TRANSAK_ENV: ${{ secrets.EXPO_PUBLIC_TRANSAK_ENV }}
      EXPO_PUBLIC_P2P_URL: ${{ secrets.EXPO_PUBLIC_P2P_URL }}
      EXPO_PUBLIC_SUPPORT_URL: ${{ secrets.EXPO_PUBLIC_SUPPORT_URL }}
      EXPO_PUBLIC_PRIVACY_URL: ${{ secrets.EXPO_PUBLIC_PRIVACY_URL }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install packages
        run: npm install --legacy-peer-deps
      - name: Align versions with Expo SDK
        run: npx expo install --fix -- --legacy-peer-deps
      - name: Generate Android project
        run: npx expo prebuild -p android --clean --no-install
      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: P2Pal-APK
          path: app/android/app/build/outputs/apk/release/app-release.apk
